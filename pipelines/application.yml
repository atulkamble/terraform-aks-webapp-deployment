trigger:
  branches:
    include: [main]
  paths:
    include:
      - app/*
      - kubernetes/*
      - pipelines/application.yml

pool:
  vmImage: ubuntu-latest

variables:
  - group: aks-production
  - name: azureServiceConnection
    value: azure-production-connection
  - name: imageRepository
    value: webapp
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DockerBuild
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Build, test, scan, and push image
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                acr_server="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
                image="$acr_server/$IMAGE_REPOSITORY:$IMAGE_TAG"
                docker build --platform linux/amd64 -t "$image" ./app
                docker run -d --name webapp-test --read-only --tmpfs /tmp:uid=101,gid=101 -p 8080:8080 "$image"
                trap 'docker rm -f webapp-test >/dev/null 2>&1 || true' EXIT
                for attempt in {1..30}; do
                  if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
                  sleep 1
                done
                curl --fail http://127.0.0.1:8080/health
                curl --fail http://127.0.0.1:8080/ | grep -q 'Production AKS Deployment'
                docker save "$image" -o "$(Agent.TempDirectory)/webapp.tar"
                docker run --rm -v "$(Agent.TempDirectory):/scan" aquasec/trivy:latest \
                  image --input /scan/webapp.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
                az acr login --name "$ACR_NAME"
                docker push "$image"
            env:
              ACR_NAME: $(acrName)
              IMAGE_REPOSITORY: $(imageRepository)
              IMAGE_TAG: $(imageTag)

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployAKS
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: KubectlInstaller@0
                  inputs:
                    kubectlVersion: latest
                - task: KubeloginInstaller@0
                  inputs:
                    kubeloginVersion: latest
                - task: AzureCLI@2
                  displayName: Deploy to AKS and verify rollout
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing
                      kubelogin convert-kubeconfig -l azurecli
                      acr_server="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
                      image="$acr_server/$IMAGE_REPOSITORY:$IMAGE_TAG"
                      kubectl apply -f kubernetes/namespace.yaml
                      kubectl set image --local -f kubernetes/deployment.yaml "webapp=$image" -o yaml | kubectl apply -f -
                      kubectl apply -f kubernetes/service.yaml -f kubernetes/hpa.yaml
                      kubectl rollout status deployment/webapp -n production --timeout=300s
                      kubectl get pods,service,hpa -n production
                  env:
                    RESOURCE_GROUP: $(resourceGroup)
                    AKS_CLUSTER: $(aksCluster)
                    ACR_NAME: $(acrName)
                    IMAGE_REPOSITORY: $(imageRepository)
                    IMAGE_TAG: $(imageTag)
