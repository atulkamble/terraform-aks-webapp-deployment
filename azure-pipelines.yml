
# ==========================================================
# Azure DevOps CI/CD Pipeline
# GitHub -> Docker -> Test -> Trivy -> ACR -> AKS
# ==========================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - kubernetes/**
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

# ==========================================================
# VARIABLES
# ==========================================================

variables:
  azureServiceConnection: 'project'
  resourceGroup: 'rg-aks-production'
  aksClusterName: 'aks-production'
  acrName: 'atulkamble'
  imageRepository: 'webapp'
  imageTag: '$(Build.BuildId)'
  namespace: 'production'

stages:

# ==========================================================
# STAGE 1 - BUILD, TEST, SCAN, PUSH
# ==========================================================

- stage: Build
  displayName: 'Build, Test, Scan and Push'

  jobs:
  - job: BuildImage
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build, Test, Scan and Push to ACR'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)'

        inlineScript: |
          set -euo pipefail

          echo "=================================="
          echo "1. Azure Authentication"
          echo "=================================="

          az account show --output table

          ACR_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)

          IMAGE="$ACR_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"

          echo "Image: $IMAGE"

          echo "=================================="
          echo "2. Build Docker Image"
          echo "=================================="

          docker build \
            --pull \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            ./app

          echo "=================================="
          echo "3. Validate Nginx Configuration"
          echo "=================================="

          docker run --rm \
            "$IMAGE" nginx -t

          echo "=================================="
          echo "4. Start Test Container"
          echo "=================================="

          CONTAINER="webapp-test-$IMAGE_TAG"

          cleanup() {
            docker rm -f "$CONTAINER" \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER" \
            -p 127.0.0.1:18080:8080 \
            "$IMAGE"

          docker ps -a

          echo "=================================="
          echo "5. Application Health Check"
          echo "=================================="

          HEALTHY=false

          for i in $(seq 1 20); do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:18080/health; then

              echo "Health check passed"
              HEALTHY=true
              break

            fi

            echo "Waiting for application ($i/20)"
            sleep 3

          done

          if [ "$HEALTHY" != "true" ]; then

            echo "Health check failed"
            docker logs "$CONTAINER"
            docker inspect "$CONTAINER" \
              --format '{{.State.Status}} {{.State.ExitCode}}'

            exit 1
          fi

          echo "=================================="
          echo "6. Test Homepage"
          echo "=================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://127.0.0.1:18080/ \
            > /dev/null

          echo "Homepage test passed"

          cleanup
          trap - EXIT

          echo "=================================="
          echo "7. Trivy Security Scan"
          echo "=================================="

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"

          echo "=================================="
          echo "8. Login to Azure Container Registry"
          echo "=================================="

          az acr login --name "$ACR_NAME"

          echo "=================================="
          echo "9. Push Image to ACR"
          echo "=================================="

          docker push "$IMAGE"

          echo "=================================="
          echo "10. Prepare Deployment Artifact"
          echo "=================================="

          mkdir -p "$ARTIFACT_DIR"

          cp kubernetes/*.yaml "$ARTIFACT_DIR/"

          printf '%s\n' "$IMAGE" \
            > "$ARTIFACT_DIR/image.txt"

          echo "Build stage completed successfully"

      env:
        ACR_NAME: $(acrName)
        RESOURCE_GROUP: $(resourceGroup)
        IMAGE_REPOSITORY: $(imageRepository)
        IMAGE_TAG: $(imageTag)
        ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)/release

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Deployment Artifacts'

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/release'
        artifact: release
        publishLocation: pipeline

# ==========================================================
# STAGE 2 - DEPLOY TO AKS
# ==========================================================

- stage: Deploy
  displayName: 'Deploy Application to AKS'

  dependsOn: Build

  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:

  - deployment: DeployWebapp
    displayName: 'Deploy Web Application'
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: release

          - task: AzureCLI@2
            displayName: 'Deploy and Verify AKS'

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |
                set -euo pipefail

                echo "=================================="
                echo "1. Azure Authentication"
                echo "=================================="

                az account show --output table

                echo "=================================="
                echo "2. Install kubectl and kubelogin"
                echo "=================================="

                TOOLS_DIR="$AGENT_TEMPDIRECTORY/aks-tools"
                mkdir -p "$TOOLS_DIR"

                AKS_VERSION=$(az aks show \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$AKS_CLUSTER_NAME" \
                  --query kubernetesVersion \
                  --output tsv)

                az aks install-cli \
                  --client-version "$AKS_VERSION" \
                  --install-location "$TOOLS_DIR/kubectl" \
                  --kubelogin-install-location "$TOOLS_DIR/kubelogin"

                export PATH="$TOOLS_DIR:$PATH"

                kubectl version --client
                kubelogin --version

                echo "=================================="
                echo "3. Connect to AKS"
                echo "=================================="

                az aks get-credentials \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$AKS_CLUSTER_NAME" \
                  --file "$KUBECONFIG" \
                  --overwrite-existing

                kubelogin convert-kubeconfig \
                  -l azurecli

                echo "=================================="
                echo "4. Verify AKS Connection"
                echo "=================================="

                kubectl get nodes

                echo "=================================="
                echo "5. Read Image Reference"
                echo "=================================="

                IMAGE=$(cat "$RELEASE_DIR/image.txt")

                echo "Deploying image: $IMAGE"

                echo "=================================="
                echo "6. Create Namespace"
                echo "=================================="

                kubectl apply \
                  -f "$RELEASE_DIR/namespace.yaml"

                echo "=================================="
                echo "7. Deploy Application"
                echo "=================================="

                kubectl set image --local \
                  -f "$RELEASE_DIR/deployment.yaml" \
                  "webapp=$IMAGE" \
                  -o yaml | kubectl apply -f -

                echo "=================================="
                echo "8. Deploy Service"
                echo "=================================="

                kubectl apply \
                  -f "$RELEASE_DIR/service.yaml"

                echo "=================================="
                echo "9. Deploy HPA"
                echo "=================================="

                kubectl apply \
                  -f "$RELEASE_DIR/hpa.yaml"

                echo "=================================="
                echo "10. Verify Deployment Rollout"
                echo "=================================="

                if ! kubectl rollout status \
                  deployment/webapp \
                  -n "$NAMESPACE" \
                  --timeout=300s; then

                  echo "Deployment failed"

                  kubectl get pods \
                    -n "$NAMESPACE" -o wide || true

                  kubectl describe deployment webapp \
                    -n "$NAMESPACE" || true

                  kubectl get events \
                    -n "$NAMESPACE" \
                    --sort-by=.lastTimestamp || true

                  exit 1
                fi

                echo "=================================="
                echo "11. Final Verification"
                echo "=================================="

                kubectl get deployments \
                  -n "$NAMESPACE"

                kubectl get pods \
                  -n "$NAMESPACE" -o wide

                kubectl get svc \
                  -n "$NAMESPACE"

                kubectl get hpa \
                  -n "$NAMESPACE"

                echo "=================================="
                echo "AKS Deployment Completed"
                echo "=================================="

            env:
              RESOURCE_GROUP: $(resourceGroup)
              AKS_CLUSTER_NAME: $(aksClusterName)
              NAMESPACE: $(namespace)
              RELEASE_DIR: $(Pipeline.Workspace)/release
              KUBECONFIG: $(Agent.TempDirectory)/webapp-kubeconfig
