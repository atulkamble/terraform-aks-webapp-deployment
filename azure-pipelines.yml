trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - kubernetes/**
      - pipelines/application.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'project'
  resourceGroup: 'rg-aks-production'
  aksCluster: 'aks-production'
  acrName: 'atulkamble'
  acrLoginServer: 'atulkamble.azurecr.io'
  imageRepository: 'webapp'
  imageTag: '$(Build.BuildId)'
  namespace: 'production'

stages:

# ==========================================
# STAGE 1: BUILD, TEST, SCAN AND PUSH
# ==========================================

- stage: Build
  displayName: 'Build, Test, Scan and Push'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build, Test, Scan and Push to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"
          TEST_CONTAINER="webapp-test-$(Build.BuildId)"

          echo "1. Azure Authentication"
          az account show --output table

          echo "2. Build Docker Image"
          docker build -t "$IMAGE" ./app

          echo "3. Validate Nginx Configuration"
          docker run --rm \
            --entrypoint /usr/sbin/nginx \
            "$IMAGE" -t

          echo "4. Test Application"
          docker run -d \
            --name "$TEST_CONTAINER" \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE"

          trap 'docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true' EXIT

          HEALTH_OK=0

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            docker logs "$TEST_CONTAINER"
            exit 1
          fi

          echo "5. Scan Docker Image"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --image-src docker \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "$IMAGE"

          echo "6. Login to ACR"
          az acr login --name "$(acrName)"

          echo "7. Push Image"
          docker push "$IMAGE"

          echo "Image pushed successfully: $IMAGE"

# ==========================================
# STAGE 2: DEPLOY TO AKS
# ==========================================

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployJob
    displayName: 'Deploy Application'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy Application to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "1. Install kubectl and kubelogin"
          az aks install-cli

          echo "2. Connect to AKS"
          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

          echo "3. Verify Cluster"
          kubectl get nodes

          echo "4. Create Namespace"
          kubectl create namespace "$(namespace)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "5. Update Deployment Image"

          export IMAGE

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("kubernetes/deployment.yaml")
          content = path.read_text()

          content, count = re.subn(
              r"(^\s*image:\s*)\S+",
              lambda match: match.group(1) + os.environ["IMAGE"],
              content,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit("Deployment image field not found")

          Path("/tmp/deployment.yaml").write_text(content)
          PY

          echo "6. Apply Kubernetes Manifests"
          kubectl apply \
            -f /tmp/deployment.yaml \
            -n "$(namespace)"

          kubectl apply \
            -f kubernetes/service.yaml \
            -n "$(namespace)"

          if [ -f kubernetes/hpa.yaml ]; then
            kubectl apply \
              -f kubernetes/hpa.yaml \
              -n "$(namespace)"
          fi

          echo "7. Verify Deployment"
          kubectl rollout status \
            deployment/webapp \
            -n "$(namespace)" \
            --timeout=300s

          echo "8. Verify Resources"
          kubectl get pods -n "$(namespace)"
          kubectl get deployments -n "$(namespace)"
          kubectl get svc -n "$(namespace)"
          kubectl get hpa -n "$(namespace)" || true

          echo "AKS deployment completed successfully"