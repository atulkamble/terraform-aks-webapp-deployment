trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AzureServiceConnection'
  resourceGroup: 'rg-aks-production'
  aksClusterName: 'aks-production'

steps:

- task: AzureCLI@2
  displayName: 'Connect to AKS'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -e

      echo "Installing kubectl and kubelogin..."

      az aks install-cli

      echo "kubectl version:"
      kubectl version --client

      echo "kubelogin version:"
      kubelogin --version

      echo "Getting AKS credentials..."

      az aks get-credentials \
        --resource-group "$(resourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      echo "Converting kubeconfig for Azure CLI authentication..."

      kubelogin convert-kubeconfig -l azurecli

      echo "Current Kubernetes context:"

      kubectl config current-context

      echo "Testing AKS connection..."

      kubectl get nodes

- task: KubernetesManifest@1
  displayName: 'Deploy Kubernetes manifests'
  inputs:
    action: 'deploy'
    manifests: |
      $(System.DefaultWorkingDirectory)/kubernetes/*.yaml 
