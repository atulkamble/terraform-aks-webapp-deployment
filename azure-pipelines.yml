trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - kubernetes/*
      - pipelines/application.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'azure-production-connection'
  resourceGroup: 'rg-aks-production'
  aksCluster: 'aks-production'
  acrName: 'atulkamble'
  acrLoginServer: 'atulkamble.azurecr.io'
  imageRepository: 'webapp'
  imageTag: '$(Build.BuildId)'
  namespace: 'production'

stages:

# ==========================================
# STAGE 1: BUILD, TEST, SCAN AND PUSH
# ==========================================

- stage: Build
  displayName: 'Build, Test, Scan and Push'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build, Test, Scan and Push to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "=================================="
          echo "1. Azure Authentication"
          echo "=================================="
          az account show --output table

          echo "Image: $IMAGE"

          echo "=================================="
          echo "2. Build Docker Image"
          echo "=================================="

          docker build \
            -t "$IMAGE" \
            ./app

          echo "=================================="
          echo "3. Validate Nginx Configuration"
          echo "=================================="

          docker run --rm \
            --entrypoint nginx \
            "$IMAGE" \
            -t

          echo "=================================="
          echo "4. Test Application"
          echo "=================================="

          docker run -d \
            --name webapp-test \
            -p 8080:8080 \
            "$IMAGE"

          trap 'docker rm -f webapp-test >/dev/null 2>&1 || true' EXIT

          HEALTH_OK=0

          for i in {1..15}; do
            if curl --fail --silent \
              http://localhost:8080/health; then
              HEALTH_OK=1
              break
            fi

            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Health check failed"
            docker logs webapp-test
            exit 1
          fi

          echo "Application health check passed"

          echo "=================================="
          echo "5. Scan Docker Image"
          echo "=================================="

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "$IMAGE"

          echo "=================================="
          echo "6. Login to ACR"
          echo "=================================="

          az acr login \
            --name "$(acrName)"

          echo "=================================="
          echo "7. Push Image to ACR"
          echo "=================================="

          docker push "$IMAGE"

          echo "Image pushed successfully: $IMAGE"


# ==========================================
# STAGE 2: DEPLOY TO AKS
# ==========================================

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployJob
    displayName: 'Deploy Application'
    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy Docker Image to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "=================================="
          echo "1. Install kubectl and kubelogin"
          echo "=================================="

          az aks install-cli

          echo "=================================="
          echo "2. Connect to AKS"
          echo "=================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          kubelogin convert-kubeconfig \
            -l azurecli

          echo "=================================="
          echo "3. Verify Cluster"
          echo "=================================="

          kubectl get nodes

          echo "=================================="
          echo "4. Create Namespace"
          echo "=================================="

          kubectl create namespace "$(namespace)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "=================================="
          echo "5. Deploy Kubernetes Resources"
          echo "=================================="

          kubectl apply \
            -f kubernetes/deployment.yaml \
            -n "$(namespace)"

          kubectl apply \
            -f kubernetes/service.yaml \
            -n "$(namespace)"

          if [ -f kubernetes/hpa.yaml ]; then
            kubectl apply \
              -f kubernetes/hpa.yaml \
              -n "$(namespace)"
          fi

          echo "=================================="
          echo "6. Update Container Image"
          echo "=================================="

          kubectl set image \
            deployment/webapp \
            webapp="$IMAGE" \
            -n "$(namespace)"

          echo "=================================="
          echo "7. Verify Rollout"
          echo "=================================="

          kubectl rollout status \
            deployment/webapp \
            -n "$(namespace)" \
            --timeout=300s

          echo "=================================="
          echo "8. Verify Resources"
          echo "=================================="

          kubectl get deployments -n "$(namespace)"
          kubectl get pods -n "$(namespace)"
          kubectl get svc -n "$(namespace)"
          kubectl get hpa -n "$(namespace)"

          echo "Deployment completed successfully"