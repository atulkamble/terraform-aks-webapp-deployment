trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - kubernetes/**
      - pipelines/application.yml

pr: none

pool:
  vmImage: ubuntu-latest


variables:
  azureServiceConnection: 'azure-production-connection'
  resourceGroup: 'rg-aks-production'
  aksCluster: 'aks-production'
  acrName: 'atulkamble'
  acrLoginServer: 'atulkamble.azurecr.io'
  imageRepository: 'webapp'
  imageTag: '$(Build.BuildId)'
  namespace: 'production'

stages:

# ==========================================
# STAGE 1: BUILD, TEST, SCAN, PUSH
# ==========================================

- stage: Build
  displayName: 'Build, Test, Scan and Push'
  jobs:
  - job: BuildJob
    displayName: 'Docker Build and Push'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build, Test, Scan and Push to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "1. Verify Azure Authentication"
          az account show --output table

          echo "2. Build Docker Image"
          docker build -t "$IMAGE" ./app

          echo "3. Validate Nginx Configuration"

          # FIX: Avoid passing nginx twice
          docker run --rm \
            --entrypoint /usr/sbin/nginx \
            "$IMAGE" \
            -t

          echo "4. Test Application"

          docker run -d \
            --name "webapp-test-$(Build.BuildId)" \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE"

          trap 'docker rm -f "webapp-test-$(Build.BuildId)" >/dev/null 2>&1 || true' EXIT

          HEALTH_OK=0
          for i in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/health; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            docker logs "webapp-test-$(Build.BuildId)"
            exit 1
          fi

          echo "Health check passed"

          echo "5. Scan Docker Image"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --image-src docker \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "$IMAGE"

          echo "6. Login to Azure Container Registry"
          az acr login --name "$(acrName)"

          echo "7. Push Docker Image"
          docker push "$IMAGE"

          echo "Successfully pushed: $IMAGE"

# ==========================================
# STAGE 2: DEPLOY TO AKS
# ==========================================

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'AKS Deployment'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy Application to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "1. Install kubectl and kubelogin"
          az aks install-cli

          echo "2. Connect to AKS using Entra ID"
          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

          echo "3. Verify Cluster"
          kubectl get nodes

          echo "4. Create Namespace"
          kubectl create namespace "$(namespace)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "5. Prepare Image Deployment"
          cp kubernetes/deployment.yaml /tmp/webapp-deployment.yaml

          # Update container image in manifest before apply
          export IMAGE
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("/tmp/webapp-deployment.yaml")
          content = path.read_text()
          import re
          content, count = re.subn(
              r"(^\s*image:\s*)\S+",
              lambda m: m.group(1) + os.environ["IMAGE"],
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Deployment image field not found")
          path.write_text(content)
          PY

          echo "6. Deploy Kubernetes Resources"
          kubectl apply \
            -f /tmp/webapp-deployment.yaml \
            -n "$(namespace)"

          kubectl apply \
            -f kubernetes/service.yaml \
            -n "$(namespace)"

          if [ -f kubernetes/hpa.yaml ]; then
            kubectl apply \
              -f kubernetes/hpa.yaml \
              -n "$(namespace)"
          fi

          echo "7. Verify Rollout"
          kubectl rollout status \
            deployment/webapp \
            -n "$(namespace)" \
            --timeout=300s

          echo "8. Verify Resources"
          kubectl get deployments -n "$(namespace)"
          kubectl get pods -n "$(namespace)"
          kubectl get svc -n "$(namespace)"
          kubectl get hpa -n "$(namespace)" || true

          echo "Deployment completed successfully"
